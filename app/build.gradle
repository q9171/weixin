plugins {
    id 'com.android.application'
}

android {
    namespace 'com.workbuddy.roomchat'
    compileSdk 34

    defaultConfig {
        applicationId "com.workbuddy.roomchat"
        minSdk 24
        targetSdk 34
        versionCode 22
        versionName "1.2.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
