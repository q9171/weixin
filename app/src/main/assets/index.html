<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>威信</title>
<style>
  :root{
    --bg:#0a1722; --panel:#0f2436; --panel2:#123048; --accent:#38b0de;
    --me:#38b0de; --me-text:#fff; --other:#0e2c40; --other-text:#d6ecf5;
    --muted:#6fa6c2; --line:#1b4360;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:#e9edf0}
  #app{display:flex;flex-direction:column;height:100%;height:100dvh;max-width:720px;margin:0 auto;background:var(--bg)}

  .top{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--panel);border-bottom:1px solid var(--line);padding-top:max(12px,env(safe-area-inset-top))}
  .top .title{font-size:15.5px;font-weight:600}
  .top .sub{font-size:11.5px;color:var(--muted)}
  .top .status{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
  .status .led{width:8px;height:8px;border-radius:50%;background:#3a6a85}
  .status.ok .led{background:#3ddc84;box-shadow:0 0 6px #3ddc84}
  .status.bad .led{background:#ff5b5b}
  .gear{margin-left:auto;background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 6px}

  /* 频道列表 */
  #channels{display:none;flex-direction:column;height:100%;height:100dvh}
  .chanlist{flex:1;overflow-y:auto;padding:12px}
  .chan{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .chan-info{flex:1;min-width:0}
  .chan-title{font-size:15px;font-weight:600;word-break:break-all;display:flex;align-items:center;gap:8px}
  .chan-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
  .chan-enter{background:var(--accent);color:#fff;border:none;border-radius:20px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer}
  .chan-del{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 6px;line-height:1}
  .badge{display:none;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#ff5b5b;color:#fff;font-size:11px;font-weight:700;align-items:center;justify-content:center}
  .badge.show{display:inline-flex}
  .fab{margin:0 14px 14px;padding:13px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:15.5px;font-weight:600;cursor:pointer;margin-bottom:max(14px,env(safe-area-inset-bottom))}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:40px 20px;line-height:1.6}

  /* 新建频道 */
  #join{display:none;position:fixed;inset:0;background:linear-gradient(160deg,#0a1722,#0f2436 60%,#123048);align-items:center;justify-content:center;padding:24px;z-index:30}
  .card{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px 22px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
  .logo{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .logo .dot{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#38b0de,#2e8bdd);display:flex;align-items:center;justify-content:center;font-size:22px}
  .logo h1{font-size:21px;margin:0;letter-spacing:.5px}
  .logo p{margin:2px 0 0;font-size:12px;color:var(--muted)}
  label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
  input{width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:#fff;font-size:15px;outline:none}
  input:focus{border-color:var(--accent)}
  .hint{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.5}
  .btn{width:100%;margin-top:18px;padding:13px;border:none;border-radius:11px;background:var(--accent);color:#fff;font-size:15.5px;font-weight:600;cursor:pointer}

  /* 聊天 */
  #chat{display:none;flex-direction:column;height:100%;height:100dvh}
  .top .back{background:none;border:none;color:var(--accent);font-size:14px;cursor:pointer;padding:6px 4px;margin-right:4px}
  /* 聊天背景主题（默认浅紫，可在设置里切换：浅红/浅蓝/浅紫） */
  body{--chat-bg:#ede7f6;--chat-name:#7e6fa6;--chat-meta:#9a8fbd;--chat-sys:#7e6fa6;--chat-sysbg:#e0d6f0;--chat-otext:#3a3550;--chat-shadow:rgba(103,58,183,.12)}
  body.bg-red{--chat-bg:#fdeaea;--chat-name:#a86a6a;--chat-meta:#c09090;--chat-sys:#a86a6a;--chat-sysbg:#f5d5d5;--chat-otext:#4a3535;--chat-shadow:rgba(183,58,58,.12)}
  body.bg-blue{--chat-bg:#e3f2fd;--chat-name:#6a87a8;--chat-meta:#8fa8c0;--chat-sys:#6a87a8;--chat-sysbg:#d0e4f5;--chat-otext:#35404a;--chat-shadow:rgba(58,120,183,.12)}
  #msgs{flex:1;overflow-y:auto;padding:14px 12px 6px;display:flex;flex-direction:column;gap:9px;background:var(--chat-bg)}
  .row{display:flex;flex-direction:column;max-width:78%}
  .row.me{align-self:flex-end;align-items:flex-end}
  .row.other{align-self:flex-start;align-items:flex-start}
  .name{font-size:11px;color:var(--chat-name);margin:0 6px 3px}
  .bubble{padding:9px 12px;border-radius:14px;font-size:14.5px;line-height:1.45;word-wrap:break-word;white-space:pre-wrap}
  .row.me .bubble{background:var(--me);color:var(--me-text);border-bottom-right-radius:4px}
  .row.other .bubble{background:#ffffff;color:var(--chat-otext);border-bottom-left-radius:4px;box-shadow:0 1px 2px var(--chat-shadow)}
  .meta{font-size:10px;color:var(--chat-meta);margin:3px 6px 0}
  .sys{align-self:center;font-size:11.5px;color:var(--chat-sys);background:var(--chat-sysbg);padding:4px 10px;border-radius:10px;margin:2px 0}
  .typing{align-self:flex-start;font-size:11.5px;color:var(--muted);padding:2px 6px;height:16px}
  .compose{display:flex;gap:8px;padding:10px 12px;background:var(--panel);border-top:1px solid var(--line);padding-bottom:max(10px,env(safe-area-inset-bottom))}
  .compose input{flex:1;background:var(--panel2);border-radius:20px;padding:11px 16px}
  .compose .send{width:46px;min-width:46px;border:none;border-radius:50%;background:var(--accent);color:#fff;font-size:18px;cursor:pointer}
  .emoji-btn{width:42px;min-width:42px;border:none;background:var(--panel2);color:#fff;font-size:21px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .emoji-btn:active{transform:scale(.94)}
  .emoji-panel{display:none;position:absolute;left:0;right:0;bottom:64px;background:var(--panel);border-top:1px solid var(--line);padding:10px 12px;max-height:230px;overflow-y:auto;z-index:20}
  .emoji-panel.show{display:block}
  .emoji-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .emoji-grid button{border:none;background:none;font-size:23px;line-height:1;padding:7px 0;border-radius:10px;cursor:pointer}
  .emoji-grid button:active{background:var(--panel2)}
  .changelog{white-space:pre-line;line-height:1.6}

  /* 时间分组 / 已读分隔线 */
  .date-sep{align-self:center;font-size:11px;color:var(--chat-sys);background:var(--chat-sysbg);padding:3px 12px;border-radius:10px;margin:10px 0 2px;opacity:.9}
  .read-sep{align-self:center;font-size:10.5px;color:var(--chat-meta);margin:4px 0 0;opacity:.8}
  /* 引用显示 */
  .quote{font-size:12px;color:var(--chat-meta);background:rgba(0,0,0,.06);border-left:3px solid var(--accent);border-radius:6px;padding:5px 9px;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row.me .quote{color:rgba(255,255,255,.85);background:rgba(255,255,255,.15)}
  .revoked{align-self:center;font-size:11.5px;color:var(--chat-meta);font-style:italic;opacity:.8;margin:2px 0}
  mark{background:#ffe58a;color:#333;padding:0 2px;border-radius:3px}

  /* 引用回复条 */
  #replyBar{display:none;align-items:center;gap:8px;padding:8px 12px;background:var(--panel2);border-top:1px solid var(--line);font-size:12.5px;color:#cfe6f2}
  #replyBar.show{display:flex}
  #replyBar .rb-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #replyBar .rb-close{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:2px 6px}

  /* 搜索栏 */
  #searchBar{display:none;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
  #searchBar.show{display:flex}
  #searchInput{flex:1;background:var(--panel2);border-radius:20px;padding:9px 14px;font-size:14px}
  #searchCount{font-size:12px;color:var(--muted);white-space:nowrap}
  #searchClose{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:2px 6px}

  /* 长按菜单 */
  #ctxMenu{position:fixed;z-index:70;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 12px 40px rgba(0,0,0,.5);display:none;min-width:160px}
  #ctxMenu.show{display:block}
  #ctxMenu button{display:flex;width:100%;align-items:center;gap:10px;background:none;border:none;color:#e9edf0;font-size:14px;padding:12px 14px;border-radius:10px;cursor:pointer;text-align:left}
  #ctxMenu button:active{background:var(--panel2)}
  #ctxMenu button .ic{font-size:17px;width:22px;text-align:center}
  #ctxMask{position:fixed;inset:0;z-index:65;display:none}
  #ctxMask.show{display:block}

  /* 设置 */
  #settings{position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.55);display:none;padding:24px;padding-bottom:max(24px,env(safe-area-inset-bottom));z-index:25;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
  #settings .card{width:100%;max-width:360px;margin:20px auto;position:relative}
  .card h2{margin:0 0 6px;font-size:16px}
  .close{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer}
  .toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#000a;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;z-index:80;pointer-events:none;max-width:80%;text-align:center}
  .toast.show{opacity:1}

  /* 自动更新横幅 */
  #updateBanner{display:none;position:fixed;left:12px;right:12px;top:max(12px,env(safe-area-inset-top));background:linear-gradient(135deg,#38b0de,#2e8bdd);color:#fff;border-radius:14px;padding:13px 16px;font-size:13.5px;z-index:45;box-shadow:0 10px 30px rgba(0,0,0,.4);cursor:pointer}
  #updateBanner b{font-size:14.5px}
  #updateBanner small{display:block;opacity:.85;margin-top:2px}

  /* 更新区域 */
  .ver{font-size:12px;color:var(--muted);margin:-2px 0 4px}
  .upd{margin-top:10px;font-size:12.5px;color:var(--muted);line-height:1.5}
  .upd.has{border:1px solid var(--accent);color:var(--accent);background:rgba(56,176,222,.08);border-radius:10px;padding:10px 12px}
  .upd .pname{font-weight:600;color:#fff}
  .progress{height:7px;border-radius:6px;background:var(--panel2);overflow:hidden;margin-top:8px;display:none}
  .progress > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}

  /* 音效开关 */
  .switchRow{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;color:#e9edf0;margin-bottom:6px}

  /* 聊天背景颜色选择 */
  .bgRow{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;color:#e9edf0;margin:14px 0 6px}
  .bgOpts{display:flex;gap:12px}
  .bgOpt{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;position:relative}
  .bgOpt.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(56,176,222,.35)}
  .bgOpt.sel::after{content:'✓';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:15px;color:#555;font-weight:700}
  .switch{position:relative;display:inline-block;width:44px;height:24px;flex:none}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;cursor:pointer;inset:0;background:#1b4360;border-radius:24px;transition:.2s}
  .slider:before{content:"";position:absolute;height:18px;width:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
  .switch input:checked + .slider{background:var(--accent)}
  .switch input:checked + .slider:before{transform:translateX(20px)}

  /* 交互特效 */
  .btn,.fab,.chan-enter,.send,.gear{transition:transform .08s ease}
  .btn:active,.fab:active,.chan-enter:active,.send:active,.gear:active{transform:scale(.96)}
  @keyframes inMe{from{opacity:0;transform:translateX(20px) scale(.96)}to{opacity:1;transform:none}}
  @keyframes inOther{from{opacity:0;transform:translateX(-20px) scale(.96)}to{opacity:1;transform:none}}
  .row.me.enter{animation:inMe .22s ease-out}
  .row.other.enter{animation:inOther .22s ease-out}
  @keyframes ringFlash{0%{box-shadow:0 0 0 0 rgba(56,176,222,0)}30%{box-shadow:0 0 0 4px rgba(56,176,222,.55)}100%{box-shadow:0 0 0 0 rgba(56,176,222,0)}}
  .row.other.enter .bubble{animation:ringFlash .6s ease-out}
  @keyframes sysPop{from{opacity:0;transform:translateY(6px) scale(.96)}to{opacity:1;transform:none}}
  .sys.enter{animation:sysPop .25s ease-out}
  @keyframes bannerPulse{0%,100%{box-shadow:0 10px 30px rgba(0,0,0,.4)}50%{box-shadow:0 10px 42px rgba(56,176,222,.55)}}
  #updateBanner{animation:bannerPulse 2.4s ease-in-out infinite}
  @media (prefers-reduced-motion: reduce){
    .row.me.enter,.row.other.enter,.row.other.enter .bubble,.sys.enter,#updateBanner{animation:none!important}
    .btn:active,.fab:active,.chan-enter:active,.send:active,.gear:active{transform:none}
  }

  /* 自动更新弹窗（进入 App 时弹出） */
  #autoUpdateModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;padding:24px;z-index:50}
  #autoUpdateModal .aum-card{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px 22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:aumPop .28s ease-out}
  @keyframes aumPop{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:none}}
  .aum-icon{font-size:34px;margin-bottom:6px}
  .aum-title{font-size:18px;font-weight:700;margin-bottom:8px}
  .aum-note{font-size:12.5px;color:var(--muted);line-height:1.5;margin-bottom:18px;max-height:120px;overflow:auto;white-space:pre-line}
  #aumUpdate{width:100%;padding:13px;border:none;border-radius:12px;background:linear-gradient(135deg,#38b0de,#2e8bdd);color:#fff;font-size:15.5px;font-weight:700;cursor:pointer;transition:transform .08s}
  #aumUpdate:active{transform:scale(.97)}
  .aum-later{display:block;width:100%;margin-top:12px;background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer}
  @media (prefers-reduced-motion: reduce){#autoUpdateModal .aum-card{animation:none!important}}

  /* 开启动画 */
  #splash{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#0a1722,#0f2436 60%,#123048);transition:opacity .55s ease}
  #splash.hide{opacity:0;pointer-events:none}
  .splash-logo{animation:splashIn .8s ease-out both}
  .splash-logo .dot{width:76px;height:76px;border-radius:22px;background:linear-gradient(145deg,#38b0de,#2e8bdd);display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 14px 44px rgba(56,176,222,.45)}
  .splash-title{margin-top:20px;font-size:27px;font-weight:700;letter-spacing:1px;animation:splashIn .8s .1s ease-out both}
  .splash-sub{margin-top:6px;font-size:12.5px;color:var(--muted);animation:splashIn .8s .2s ease-out both}
  @keyframes splashIn{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){.splash-logo,.splash-title,.splash-sub{animation:none!important}#splash{transition:none!important}}
</style>
</head>
<body>
<div id="app">

  <!-- 开启动画 -->
  <div id="splash">
    <div class="splash-logo"><div class="dot">💬</div></div>
    <div class="splash-title">威信</div>
    <div class="splash-sub">安全轻量聊天</div>
  </div>

  <!-- 频道列表（首页） -->
  <div id="channels">
    <div class="top">
      <div>
        <div class="title">威信 · 频道</div>
        <div class="sub">选择一个频道进入</div>
      </div>
      <button class="gear" id="gearC">⚙</button>
    </div>
    <div id="chanList" class="chanlist"></div>
    <button class="fab" id="newChanBtn">＋ 新建频道</button>
  </div>

  <!-- 新建频道 -->
  <div id="join">
    <div class="card">
      <div class="logo"><div class="dot">💬</div><div><h1>威信</h1><p>输入频道号，加入聊天</p></div></div>
      <label>频道号（双方填一样的）</label>
      <input id="roomInput" placeholder="例如：abc-123" autocomplete="off" />
      <label>你的昵称</label>
      <input id="nameInput" placeholder="例如：小明" autocomplete="off" />
      <button class="btn" id="joinBtn">加入频道</button>
      <div class="hint">频道号就是你们之间的暗号，只有知道它的人才能看到消息。服务器为公共中转，消息不长期留存。</div>
    </div>
  </div>

  <!-- 聊天 -->
  <div id="chat">
    <div class="top">
      <button class="back" id="exitBtn">← 频道</button>
      <div>
        <div class="title" id="roomTitle">频道</div>
        <div class="sub" id="onlineSub">在线人数：1</div>
      </div>
      <button class="gear" id="searchBtn" style="margin-left:auto;font-size:16px">🔍</button>
      <div class="status" id="status"><span class="led"></span><span id="statusText">连接中…</span></div>
    </div>
    <div id="searchBar">
      <input id="searchInput" placeholder="搜索聊天记录…" autocomplete="off" />
      <span id="searchCount"></span>
      <button id="searchClose">✕</button>
    </div>
    <div id="msgs"></div>
    <div class="typing" id="typing"></div>
    <div id="replyBar">
      <span class="rb-text"></span>
      <button class="rb-close" id="replyClose">✕</button>
    </div>
    <div class="emoji-panel" id="emojiPanel"></div>
    <div class="compose">
      <button class="emoji-btn" id="emojiBtn" type="button">😊</button>
      <input id="msgInput" placeholder="说点什么…" autocomplete="off" />
      <button class="send" id="sendBtn">➤</button>
    </div>
  </div>

  <!-- 设置 -->
  <div id="settings">
    <div class="card" style="position:relative">
      <button class="close" id="setClose">✕</button>
      <h2>设置</h2>
      <div class="switchRow"><span>交互音效</span><label class="switch"><input type="checkbox" id="soundToggle" checked /><span class="slider"></span></label></div>

      <div class="bgRow"><span>聊天背景</span>
        <div class="bgOpts">
          <button class="bgOpt" data-bg="red" title="浅红" style="background:#fdeaea"></button>
          <button class="bgOpt" data-bg="blue" title="浅蓝" style="background:#e3f2fd"></button>
          <button class="bgOpt" data-bg="purple" title="浅紫" style="background:#ede7f6"></button>
        </div>
      </div>

      <div style="height:1px;background:var(--line);margin:18px 0"></div>
      <h2>应用更新</h2>
      <div class="ver" id="verLabel">当前版本：—</div>
      <button class="btn" id="checkUpdateBtn">检查更新</button>
      <div class="upd" id="updateResult" style="display:none"></div>
      <div class="progress" id="updProgress"><i></i></div>
    </div>
  </div>

  <!-- 自动更新横幅 -->
  <div id="updateBanner">
    <b>发现新版本</b>
    <small id="bannerText">点击更新</small>
  </div>

  <!-- 进入 App 时自动弹出的更新弹窗 -->
  <div id="autoUpdateModal">
    <div class="aum-card">
      <div class="aum-icon">📲</div>
      <div class="aum-title">发现新版本 v<span id="aumVer">?</span></div>
      <div class="aum-note" id="aumNote"></div>
      <button id="aumUpdate">立即更新</button>
      <button class="aum-later" id="aumLater">稍后再说</button>
    </div>
  </div>

  <!-- 长按消息菜单 -->
  <div id="ctxMask"></div>
  <div id="ctxMenu"></div>

  <div class="toast" id="toast"></div>
</div>

<script src="mqtt.min.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var mqtt = window.mqtt;
  var client = null, room = '', me = '', broker = 'wss://broker.emqx.io:8084/mqtt';
  var topicBase = function(r){ return 'roomchat/' + r; };
  var presenceTopic = function(r){ return 'roomchat/' + r + '/presence'; };
  var readTopic = function(r){ return 'roomchat/' + r + '/read'; };
  var onlineSet = {};
  var channels = [];
  var unreadMap = {};   // room -> 未读数
  var peerReadTs = 0;   // 对方已读到的最后 ts（本视角）
  var inChat = false;   // 是否正在聊天页（用于未读路由）
  var subscribed = {};  // 已订阅的频道集合
  var lastRenderedDay = ''; // 用于时间分组
  var replyTarget = null; // 引用目标消息对象
  var searchActive = false;
  var currentKeyword = '';

  function genId(){ return 'm_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }
  function dayKey(ts){ var d=new Date(ts); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
  function dayLabel(ts){
    var d = new Date(ts), now = new Date();
    var a = new Date(d.getFullYear(),d.getMonth(),d.getDate());
    var b = new Date(now.getFullYear(),now.getMonth(),now.getDate());
    var diff = Math.round((b - a) / 86400000);
    if(diff === 0) return '今天';
    if(diff === 1) return '昨天';
    return (d.getMonth()+1) + '月' + d.getDate() + '日';
  }

  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }
  function sanitize(s){ return (s||'').trim().toLowerCase().replace(/[^a-z0-9_\-]/g,''); }

  // ---------- 交互音效（Web Audio 合成，无需音频文件） ----------
  var Sound = (function(){
    var ctx = null, enabled = true;
    function ensure(){
      if(!ctx){
        try{ var AC = window.AudioContext || window.webkitAudioContext; if(AC) ctx = new AC(); }catch(e){}
      }
      if(ctx && ctx.state === 'suspended'){ try{ ctx.resume(); }catch(e){} }
      return ctx;
    }
    function blip(freq, dur, type, vol, when){
      var c = ensure(); if(!c) return;
      var t0 = c.currentTime + (when||0);
      var o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.07, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(c.destination);
      o.start(t0); o.stop(t0 + dur + 0.02);
    }
    return {
      setEnabled:function(v){ enabled = !!v; },
      isEnabled:function(){ return enabled; },
      resume:function(){ ensure(); },
      tap:function(){ if(!enabled) return; blip(1180, 0.03, 'square', 0.09); },
      send:function(){ if(!enabled) return; blip(620, 0.09, 'triangle', 0.20); blip(960, 0.10, 'triangle', 0.14, 0.05); },
      receive:function(){ if(!enabled) return; blip(523, 0.10, 'sine', 0.18); blip(784, 0.13, 'sine', 0.14, 0.06); },
      update:function(){ if(!enabled) return; blip(659, 0.12, 'sine', 0.18); blip(880, 0.16, 'sine', 0.16, 0.10); blip(1175, 0.18, 'sine', 0.14, 0.22); }
    };
  })();
  function loadSound(){
    try{
      var v = localStorage.getItem('rc_sound');
      Sound.setEnabled(v === null ? true : (v === '1'));
    }catch(e){ Sound.setEnabled(true); }
    var t = $('soundToggle'); if(t) t.checked = Sound.isEnabled();
  }

  // ---------- 持久化 ----------
  function loadPrefs(){
    try{
      var b = localStorage.getItem('rc_broker'); if(b) broker = b;
      var c = localStorage.getItem('rc_channels'); if(c) channels = JSON.parse(c) || [];
      var u = localStorage.getItem('rc_unread'); if(u){ try{ unreadMap = JSON.parse(u) || {}; }catch(e){} }
      var n = localStorage.getItem('rc_name'); if(n) $('nameInput').value = n;
    }catch(e){}
  }
  function saveChannels(){ try{ localStorage.setItem('rc_channels', JSON.stringify(channels)); }catch(e){} }
  function saveUnread(){ try{ localStorage.setItem('rc_unread', JSON.stringify(unreadMap)); }catch(e){} }
  function findChannel(r){ for(var i=0;i<channels.length;i++){ if(channels[i].room===r) return channels[i]; } return null; }
  function addChannel(r, n){
    r = sanitize(r);
    var ch = findChannel(r);
    if(ch){ ch.name = n; } else { channels.push({room:r, name:n}); }
    saveChannels();
  }
  function removeChannel(r){
    channels = channels.filter(function(c){ return c.room !== r; });
    saveChannels();
    delete unreadMap[r]; saveUnread();
  }

  // ---------- 界面切换 ----------
  function hideAll(){ ['channels','join','chat'].forEach(function(id){ $(id).style.display='none'; }); }
  function showHome(){
    hideAll();
    if(channels.length){ renderChannels(); $('channels').style.display='flex'; }
    else { $('join').style.display='flex'; }
    // 后台保持监听所有频道，实时统计未读（仅当已有连接或存在频道时）
    if(channels.length && !client){ connect(); }
  }
  function renderChannels(){
    var list = $('chanList'); list.innerHTML='';
    if(!channels.length){
      list.innerHTML = '<div class="empty">还没有频道。<br>点下方「新建频道」输入频道号加入吧。</div>';
      return;
    }
    channels.forEach(function(ch){
      var card = document.createElement('div'); card.className='chan';
      var info = document.createElement('div'); info.className='chan-info';
      var t = document.createElement('div'); t.className='chan-title';
      var tn = document.createElement('span'); tn.textContent = ch.room; t.appendChild(tn);
      var n = unreadMap[ch.room] || 0;
      if(n > 0){
        var badge = document.createElement('span'); badge.className='badge show';
        badge.textContent = n > 99 ? '99+' : String(n);
        t.appendChild(badge);
      }
      var s = document.createElement('div'); s.className='chan-sub'; s.textContent = '昵称：' + (ch.name || '—') + (n>0 ? ' · ' + n + ' 条未读' : '');
      info.appendChild(t); info.appendChild(s);
      var enter = document.createElement('button'); enter.className='chan-enter'; enter.textContent='进入';
      enter.onclick = function(){ enterChannel(ch.room, ch.name); };
      var del = document.createElement('button'); del.className='chan-del'; del.textContent='×';
      del.onclick = function(e){ e.stopPropagation(); removeChannel(ch.room); clearHistory(ch.room); renderChannels(); if(!channels.length){ showHome(); } };
      card.appendChild(info); card.appendChild(enter); card.appendChild(del);
      list.appendChild(card);
    });
  }
  function enterChannel(r, n){
    r = sanitize(r); if(!r){ toast('频道号无效'); return; }
    room = r; me = n || ($('nameInput').value.trim()) || '我';
    try{ localStorage.setItem('rc_name', me); localStorage.setItem('rc_room', room); }catch(e){}
    hideAll(); $('chat').style.display='flex';
    inChat = true;
    $('roomTitle').textContent = '频道：' + room;
    $('msgs').innerHTML=''; onlineSet={}; peerReadTs=0; lastRenderedDay='';
    unreadMap[room] = 0; saveUnread(); renderChannels();
    renderHistory(room);
    restoreDraft();
    clearReply();
    closeSearch();
    connect();
  }

  // ---------- 连接 / 聊天 ----------
  function setStatus(ok, bad, text){
    var s = $('status');
    s.className = 'status' + (ok?' ok':'') + (bad?' bad':'');
    $('statusText').textContent = text;
  }
  function nowTime(){
    var d = new Date();
    function p(n){ return (n<10?'0':'')+n; }
    return p(d.getHours())+':'+p(d.getMinutes());
  }

  // 渲染单条消息（含时间分组/引用/已读分隔/搜索高亮）
  function addMsgEl(m, isHistory, animate){
    var msgs = $('msgs');
    // 时间分组分隔线
    if(m.ts){
      var dk = dayKey(m.ts);
      if(dk !== lastRenderedDay){
        lastRenderedDay = dk;
        var sep = document.createElement('div'); sep.className='date-sep'; sep.textContent = dayLabel(m.ts);
        msgs.appendChild(sep);
      }
    }
    var row = document.createElement('div');
    row.className = 'row ' + (m.mine?'me':'other') + (animate ? ' enter' : '');
    row.id = 'row_' + (m.id || genId());
    if(m.revoked){
      row.className = 'revoked';
      row.textContent = (m.mine ? '你' : (m.from||'对方')) + '撤回了一条消息';
      msgs.appendChild(row);
      maybeReadSep(msgs, m);
      return;
    }
    if(m.mine){
      // 已读分隔：对方已读位置
    } else {
      var name = document.createElement('div'); name.className='name'; name.textContent = m.from || '对方'; row.appendChild(name);
    }
    var b = document.createElement('div'); b.className='bubble';
    if(m.replyTo){
      var q = document.createElement('div'); q.className='quote';
      q.textContent = (m.replyTo.from||'') + '：' + (m.replyTo.text||'');
      b.appendChild(q);
    }
    var txt = document.createElement('span');
    txt.textContent = m.text;
    if(searchActive && currentKeyword){ highlight(txt, currentKeyword); }
    b.appendChild(txt);
    var meta = document.createElement('div'); meta.className='meta'; meta.textContent = fmtTime(m.ts);
    row.appendChild(b); row.appendChild(meta);
    msgs.appendChild(row);
    if(!isHistory){ bindLongPress(row, m); }
    maybeReadSep(msgs, m);
  }

  // 在 ts 不大于 peerReadTs 的最后一条「我发的」消息后插入已读分隔
  function maybeReadSep(msgs, m){
    if(!peerReadTs) return;
    if(m.mine && m.ts && m.ts <= peerReadTs){
      // 仅当这是最后一条符合条件的 mine 消息时显示
      var rows = msgs.querySelectorAll('.row.me');
      if(rows.length){
        var last = rows[rows.length - 1];
        if(last.id === 'row_' + (m.id || '')){
          var sep = document.createElement('div'); sep.className='read-sep'; sep.textContent='对方已读';
          msgs.appendChild(sep);
        }
      }
    }
  }

  function highlight(node, kw){
    if(!node || !node.textContent) return;
    var idx = node.textContent.toLowerCase().indexOf(kw.toLowerCase());
    if(idx < 0) return;
    var tail = node.textContent.slice(idx + kw.length);
    var mid = document.createElement('mark'); mid.textContent = node.textContent.slice(idx, idx+kw.length);
    var after = document.createElement('span'); after.textContent = tail;
    node.textContent = node.textContent.slice(0, idx);
    node.appendChild(mid); node.appendChild(after);
  }

  function addSys(text){
    var msgs = $('msgs');
    var s = document.createElement('div'); s.className='sys enter'; s.textContent = text;
    msgs.appendChild(s); msgs.scrollTop = msgs.scrollHeight;
  }
  function updateOnline(){
    var n = Object.keys(onlineSet).length;
    $('onlineSub').textContent = '在线人数：' + Math.max(1,n);
  }
  function connect(){
    if(!mqtt){ toast('通信库加载失败'); return; }
    if(client){ try{ client.end(true); }catch(e){} }
    subscribed = {};
    setStatus(false,false,'连接中…');
    var cid = 'rc_' + Math.random().toString(16).slice(2,10);
    client = mqtt.connect(broker, {
      clientId: cid, clean:true, reconnectPeriod:3000, connectTimeout:8000,
      username:'', password:''
    });
    client.on('connect', function(){
      setStatus(true,false,'已连接');
      subscribeAll();
      if(inChat){
        onlineSet[cid] = true;
        client.publish(presenceTopic(room), JSON.stringify({c:cid, n:me, s:1}), {qos:0});
        addSys('已加入频道「'+room+'」');
        updateOnline();
      }
    });
    client.on('reconnect', function(){ setStatus(false,false,'重连中…'); });
    client.on('offline', function(){ setStatus(false,true,'已断开'); });
    client.on('error', function(e){ setStatus(false,true,'连接错误'); });
    client.on('close', function(){ setStatus(false,true,'已断开'); });
    client.on('message', onMqttMessage);
  }
  // 订阅所有已存频道（用于后台实时未读计数）
  function subscribeAll(){
    var rooms = {};
    channels.forEach(function(c){ rooms[c.room]=true; });
    if(room) rooms[room]=true;
    Object.keys(rooms).forEach(function(r){
      if(subscribed[r]) return;
      subscribed[r]=true;
      client.subscribe(topicBase(r), {qos:0});
      client.subscribe(presenceTopic(r), {qos:0});
      client.subscribe(readTopic(r), {qos:0});
    });
  }
  function onMqttMessage(topic, payload){
    var raw = payload.toString();
    // presence：仅当前聊天频道处理
    var pm = topic.match(/^roomchat\/(.+?)\/presence$/);
    if(pm){ if(inChat && pm[1]===room){ try{ var p = JSON.parse(raw); if(p && p.c){ if(p.s){ onlineSet[p.c]=p.n||true; } else { delete onlineSet[p.c]; } updateOnline(); } }catch(e){} } return; }
    // read receipt：对方发来的已读
    var rm = topic.match(/^roomchat\/(.+?)\/read$/);
    if(rm){
      try{
        var rd = JSON.parse(raw);
        if(rd && rd.from && rd.from !== me){
          if(rd.ts && rd.ts > peerReadTs) peerReadTs = rd.ts;
          if(rm[1] === room) rerenderReadSep();
        }
      }catch(e){}
      return;
    }
    // chat / revoke
    var cm = topic.match(/^roomchat\/(.+?)$/);
    if(cm){
      var rt = cm[1];
      // 非当前频道，或不在聊天页（在频道列表）→ 该频道未读+1
      if(rt !== room || !inChat){
        if(unreadMap[rt] == null) unreadMap[rt] = 0;
        unreadMap[rt]++; saveUnread(); renderChannels();
        return;
      }
      try{
        var m = JSON.parse(raw);
        if(m.type === 'revoke'){ handleRevoke(m); return; }
        if(m && m.from && m.text != null){
          if(m.cid && m.cid === client.options.clientId){ return; } // 过滤自己回环
          var msg = {id:m.id||genId(), from:m.from, text:m.text, mine:false, ts:m.ts||Date.now(), replyTo:m.replyTo};
          addMsgEl(msg, false, true);
          appendHistory(room, msg);
          Sound.receive();
          sendReadReceipt(m.ts); // 自动发已读回执
        }
      }catch(e){}
    }
  }
  function sendReadReceipt(ts){
    if(client && client.connected && inChat){
      client.publish(readTopic(room), JSON.stringify({from:me, ts:ts}), {qos:0});
    }
  }
  function handleRevoke(m){
    // 标记本地历史中对应消息为撤回
    var h = loadHistory(room);
    var changed = false;
    for(var i=0;i<h.length;i++){ if(h[i].id === m.targetId){ h[i].revoked = true; changed = true; break; } }
    if(changed) saveHistory(room, h);
    // 更新 DOM
    var row = $('row_' + m.targetId);
    if(row){
      row.className = 'revoked';
      row.textContent = ((m.from===me)?'你':'对方') + '撤回了一条消息';
    }
    toast('一条消息已被撤回');
  }
  function send(){
    var v = $('msgInput').value.trim();
    if(!v) return;
    var msg = {
      id: genId(), from: me, text: v, mine: true, ts: Date.now(),
      replyTo: replyTarget ? {from:replyTarget.from, text:replyTarget.text} : null
    };
    addMsgEl(msg, false, true);
    appendHistory(room, msg);
    Sound.send();
    $('msgInput').value = '';
    clearReply();
    saveDraft('');
    $('emojiPanel').classList.remove('show');
    if(client && client.connected){
      client.publish(topicBase(room), JSON.stringify({
        type:'chat', id:msg.id, from:me, text:v, ts:msg.ts,
        cid:client.options.clientId, replyTo: msg.replyTo
      }), {qos:0});
    }
  }

  // ---------- 表情包 ----------
  var EMOJIS = ['😀','😁','😂','🤣','😊','😍','😘','😎','🤔','😅','😭','😡','👍','👎','👌','🙏','👏','🤝','💪','🔥','❤️','💔','⭐','✨','🎉','🌹','🌈','☀️','🌙','⚡','🍻','🍎','🐶','🐱','🚀','💡','✅','❌','⚠️','❓','💰','🎁','😴','🥳','😇','🤩','😜','🙄','😱','😏','🤗','💯','🍀','🌟','🍉','🐰','🦄','👻','💥','📱','☕','🍔'];
  function buildEmojiPanel(){
    var grid = document.createElement('div'); grid.className='emoji-grid';
    EMOJIS.forEach(function(e){
      var b = document.createElement('button'); b.type='button'; b.textContent=e;
      b.onclick = function(){ insertEmoji(e); };
      grid.appendChild(b);
    });
    var panel = $('emojiPanel'); panel.innerHTML=''; panel.appendChild(grid);
  }
  function insertEmoji(e){
    var inp = $('msgInput');
    var s = (inp.selectionStart != null) ? inp.selectionStart : inp.value.length;
    var en = (inp.selectionEnd != null) ? inp.selectionEnd : inp.value.length;
    inp.value = inp.value.slice(0,s) + e + inp.value.slice(en);
    var pos = s + e.length;
    inp.focus();
    try{ inp.setSelectionRange(pos, pos); }catch(err){}
    saveDraft(inp.value);
  }
  function toggleEmoji(){
    var p = $('emojiPanel');
    if(p.classList.contains('show')){ p.classList.remove('show'); }
    else { if(!p.querySelector('.emoji-grid')) buildEmojiPanel(); p.classList.add('show'); }
    Sound.tap();
  }

  // ---------- 聊天记录持久化 ----------
  var MAX_HISTORY = 500; // 每频道最多存500条，防止localStorage撑爆
  function histKey(r){ return 'rc_hist_' + r; }
  function loadHistory(r){
    try{ var h = localStorage.getItem(histKey(r)); if(h) return JSON.parse(h) || []; }catch(e){}
    return [];
  }
  function saveHistory(r, arr){
    try{
      if(arr.length > MAX_HISTORY) arr = arr.slice(arr.length - MAX_HISTORY);
      localStorage.setItem(histKey(r), JSON.stringify(arr));
    }catch(e){ /* 存储满或隐私模式，静默失败 */ }
  }
  function appendHistory(r, m){
    var h = loadHistory(r);
    var rec = {id:m.id, from:m.from, text:m.text, mine:m.mine, ts:m.ts||0, replyTo:m.replyTo, revoked:m.revoked};
    h.push(rec);
    saveHistory(r, h);
  }
  function clearHistory(r){ try{ localStorage.removeItem(histKey(r)); }catch(e){} }
  function renderHistory(r){
    var h = loadHistory(r);
    if(!h.length) return;
    h.forEach(function(m){
      if(!m.id) m.id = genId();
      addMsgEl(m, true, false);
    });
  }
  function fmtTime(ts){
    if(!ts) return nowTime();
    var d = new Date(ts);
    function p(n){ return (n<10?'0':'')+n; }
    return p(d.getHours())+':'+p(d.getMinutes());
  }
  function rerenderReadSep(){
    // 简单重渲染：清空 msgs 重画历史（保留动画前的静态态）
    var msgs = $('msgs');
    msgs.innerHTML=''; lastRenderedDay='';
    var h = loadHistory(room);
    h.forEach(function(m){ if(!m.id) m.id=genId(); addMsgEl(m, true, false); });
    msgs.scrollTop = msgs.scrollHeight;
  }

  // ---------- 长按菜单 ----------
  var pressTimer = null, pressMoved = false, pressStartX=0, pressStartY=0;
  function bindLongPress(row, m){
    row.addEventListener('touchstart', function(e){
      pressMoved = false;
      pressStartX = e.touches[0].clientX; pressStartY = e.touches[0].clientY;
      pressTimer = setTimeout(function(){
        if(!pressMoved) showCtxMenu(row, m, pressStartX, pressStartY);
      }, 480);
    }, {passive:true});
    row.addEventListener('touchmove', function(e){
      var dx = Math.abs(e.touches[0].clientX - pressStartX);
      var dy = Math.abs(e.touches[0].clientY - pressStartY);
      if(dx > 10 || dy > 10){ pressMoved = true; if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; } }
    }, {passive:true});
    row.addEventListener('touchend', function(){
      if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; }
    });
    // 桌面端右键菜单
    row.addEventListener('contextmenu', function(e){
      e.preventDefault();
      showCtxMenu(row, m, e.clientX, e.clientY);
    });
  }
  function showCtxMenu(row, m, x, y){
    if(m.revoked) return;
    var menu = $('ctxMenu'); menu.innerHTML='';
    function item(ic, label, fn){
      var b = document.createElement('button');
      b.innerHTML = '<span class="ic">'+ic+'</span><span>'+label+'</span>';
      b.onclick = function(){ hideCtxMenu(); fn(); };
      menu.appendChild(b);
    }
    item('📋','复制', function(){
      try{ if(navigator.clipboard){ navigator.clipboard.writeText(m.text); } }catch(e){}
      toast('已复制');
    });
    if(m.mine){
      item('↩️','撤回', function(){ revokeMsg(m); });
    }
    item('💬','引用', function(){ setReply(m); });
    item('🗑️','删除（仅本地）', function(){ deleteLocal(m); });
    menu.style.left = Math.min(x, window.innerWidth - 175) + 'px';
    menu.style.top = Math.min(y, window.innerHeight - 240) + 'px';
    menu.classList.add('show'); $('ctxMask').classList.add('show');
  }
  function hideCtxMenu(){ $('ctxMenu').classList.remove('show'); $('ctxMask').classList.remove('show'); }
  $('ctxMask').addEventListener('click', hideCtxMenu);

  function revokeMsg(m){
    // 本地标记
    var h = loadHistory(room);
    for(var i=0;i<h.length;i++){ if(h[i].id === m.id){ h[i].revoked = true; break; } }
    saveHistory(room, h);
    var row = $('row_' + m.id);
    if(row){ row.className='revoked'; row.textContent = '你撤回了一条消息'; }
    // 通知对方
    if(client && client.connected){
      client.publish(topicBase(room), JSON.stringify({type:'revoke', targetId:m.id, from:me, ts:Date.now(), cid:client.options.clientId}), {qos:0});
    }
    toast('已撤回');
  }
  function deleteLocal(m){
    var h = loadHistory(room);
    h = h.filter(function(x){ return x.id !== m.id; });
    saveHistory(room, h);
    var row = $('row_' + m.id);
    if(row) row.remove();
    toast('已删除');
  }
  function setReply(m){
    replyTarget = {from:m.from, text:m.text};
    var rb = $('replyBar');
    rb.querySelector('.rb-text').textContent = (m.from||'') + '：' + m.text;
    rb.classList.add('show');
    $('msgInput').focus();
  }
  function clearReply(){ replyTarget = null; $('replyBar').classList.remove('show'); }
  $('replyClose').onclick = clearReply;

  // ---------- 搜索 ----------
  function openSearch(){
    searchActive = true; currentKeyword = '';
    $('searchBar').classList.add('show');
    $('searchInput').value=''; $('searchCount').textContent='';
    $('searchInput').focus();
    applySearch();
  }
  function closeSearch(){
    searchActive = false; currentKeyword='';
    $('searchBar').classList.remove('show');
    if(room) rerenderReadSep();
  }
  function applySearch(){
    currentKeyword = ($('searchInput').value || '').trim();
    var msgs = $('msgs'); msgs.innerHTML=''; lastRenderedDay='';
    var h = loadHistory(room);
    var count = 0;
    h.forEach(function(m){
      if(m.revoked) return;
      if(!currentKeyword || (m.text||'').toLowerCase().indexOf(currentKeyword.toLowerCase()) >= 0){
        if(currentKeyword && (m.text||'').toLowerCase().indexOf(currentKeyword.toLowerCase()) >= 0) count++;
        addMsgEl(m, true, false);
      }
    });
    if(currentKeyword){
      $('searchCount').textContent = count > 0 ? (count + ' 条') : '无结果';
    } else {
      $('searchCount').textContent = '';
    }
    msgs.scrollTop = msgs.scrollHeight;
  }
  $('searchBtn').onclick = function(){ if(searchActive) closeSearch(); else openSearch(); };
  $('searchClose').onclick = closeSearch;
  $('searchInput').addEventListener('input', applySearch);

  // ---------- 草稿自动保存 ----------
  function draftKey(r){ return 'rc_draft_' + r; }
  function saveDraft(v){ try{ if(v) localStorage.setItem(draftKey(room), v); else localStorage.removeItem(draftKey(room)); }catch(e){} }
  function restoreDraft(){ try{ var d = localStorage.getItem(draftKey(room)); if(d) $('msgInput').value = d; }catch(e){} }

  // ---------- 事件 ----------
  $('joinBtn').onclick = function(){
    var r = sanitize($('roomInput').value);
    var n = $('nameInput').value.trim();
    if(!r){ toast('请输入频道号'); return; }
    if(!n){ toast('请输入昵称'); return; }
    addChannel(r, n);
    enterChannel(r, n);
  };
  $('newChanBtn').onclick = function(){
    hideAll(); $('join').style.display='flex';
    $('roomInput').value='';
    var last = (channels.length && channels[channels.length-1].name) || (localStorage.getItem('rc_name')||'');
    $('nameInput').value = last;
  };
  $('sendBtn').onclick = send;
  $('msgInput').addEventListener('keydown', function(e){ if(e.key==='Enter'){ send(); } });
  $('msgInput').addEventListener('input', function(){ saveDraft(this.value); });
  $('emojiBtn').onclick = function(e){ e.stopPropagation(); toggleEmoji(); };
  document.addEventListener('click', function(e){
    var p = $('emojiPanel');
    if(p.classList.contains('show')){
      var t = e.target;
      if(t && t.id !== 'emojiBtn' && !p.contains(t)){ p.classList.remove('show'); }
    }
  });
  $('exitBtn').onclick = function(){
    inChat = false; // 退出聊天页，但保留连接以继续后台监听未读
    showHome();
  };
  $('status').onclick = function(){ $('settings').style.display='block'; };
  $('gearC').onclick = function(){ $('settings').style.display='block'; };
  $('setClose').onclick = function(){ $('settings').style.display='none'; };
  function bridge(){ return (window.RoomChat) ? window.RoomChat : null; }

  // ---------- 应用更新 ----------
  function setVer(){
    try{ var b = bridge(); if(b && b.getVersion){ $('verLabel').textContent = '当前版本：' + b.getVersion(); } }catch(e){}
  }
  function showUpdateResult(res){
    var box = $('updateResult'); box.style.display='block'; box.className='upd';
    res = res || {};
    if(res.error){ box.textContent = '检查失败：' + res.error; return; }
    if(res.hasUpdate){
      box.className='upd has';
      box.innerHTML = '<div class="pname">发现新版本 v' + (res.versionName||'?') + '</div>'
        + '<div class="changelog" style="margin-top:6px"></div>'
        + '<button class="btn" id="doInstall" style="margin-top:10px">下载并安装</button>';
      box.querySelector('.changelog').textContent = (res.note||'点击「下载并安装」升级到最新版。');
      $('doInstall').onclick = function(){ pendingApkUrl = res.apkUrl || ''; doInstall(); };
    } else {
      box.textContent = '已是最新版本（v' + (res.currentName||'?') + '）。';
    }
  }
  var installFromModal = false;
  var pendingApkUrl = '';
  var installTimer = null;
  var installCallbackReceived = false;
  function doInstall(fromModal){
    var b = bridge();
    if(!b || !b.installUpdate){ toast('当前 App 版本不支持自动更新'); return; }
    installFromModal = !!fromModal;
    installCallbackReceived = false;
    if(installTimer){ clearTimeout(installTimer); installTimer = null; }
    if(installFromModal){
      var btn = $('aumUpdate'); btn.disabled = true; btn.textContent = '正在打开浏览器…';
      $('aumNote').textContent = '即将跳转到手机浏览器下载新版本…\n若浏览器没有自动打开，请长按复制链接：' + (pendingApkUrl || '');
    } else {
      $('updateResult').style.display='none';
      var pg = $('updProgress'); pg.style.display='block'; pg.firstElementChild.style.width='0%';
    }
    b.installUpdate();
    installTimer = setTimeout(function(){
      if(installCallbackReceived) return;
      if(installFromModal){
        $('autoUpdateModal').style.display='none';
        $('aumUpdate').textContent = '立即更新'; $('aumUpdate').disabled = false;
      } else {
        $('updProgress').style.display='none';
      }
      var ver = ($('aumVer').textContent || '1.2.2');
      var url = pendingApkUrl || ('https://gcore.jsdelivr.net/gh/Q9171/weixin@v' + ver + '/wei-' + ver + '.apk');
      toast('浏览器未自动打开，请复制链接手动下载：' + url);
    }, 1500);
  }
  function onUpdateChecked(res){ showUpdateResult(res); }
  function onAutoUpdate(res){
    if(!res || !res.hasUpdate) return;
    $('aumVer').textContent = res.versionName || '?';
    $('aumNote').textContent = (res.note || '点击「立即更新」即可升级到最新版。');
    pendingApkUrl = res.apkUrl || '';
    $('autoUpdateModal').style.display = 'flex';
    var ban = $('updateBanner'); if(ban) ban.style.display='none';
    Sound.update();
  }
  function onInstallProgress(p){
    p = p || 0;
    if(installFromModal){
      $('aumUpdate').textContent = '下载中…' + p + '%';
    } else {
      var i = $('updProgress'); i.style.display='block'; i.firstElementChild.style.width = p + '%';
    }
  }
  function onInstallDone(r){
    installCallbackReceived = true;
    if(installTimer){ clearTimeout(installTimer); installTimer = null; }
    if(installFromModal){
      var btn = $('aumUpdate');
      if(r === 'ok'){
        $('autoUpdateModal').style.display='none';
        return;
      } else if(r === 'no_apk'){
        $('aumNote').textContent = '未找到新版安装包，请稍后重试。';
        btn.textContent = '重试'; btn.disabled = false;
      } else if(r && r.indexOf('err')===0){
        $('aumNote').textContent = '下载失败：' + r.slice(4) + '。请检查网络后点重试。';
        btn.textContent = '重试'; btn.disabled = false;
      } else if(r && r.indexOf('launch_err')===0){
        $('aumNote').textContent = '无法打开浏览器：' + r.slice(11) + '\n请手动用浏览器打开下载地址，或稍后重试。';
        btn.textContent = '重试'; btn.disabled = false;
      } else {
        $('aumNote').textContent = '更新完成。';
      }
    } else {
      var i = $('updProgress'); i.style.display='none'; i.firstElementChild.style.width='0%';
      if(r === 'ok'){ toast('正在打开安装器…'); }
      else if(r === 'no_apk'){ toast('未找到新版安装包'); }
      else if(r && r.indexOf('err')===0){ toast('下载失败：' + r.slice(4)); }
      else if(r && r.indexOf('launch_err')===0){ toast('无法启动安装：' + r.slice(11)); }
      else if(r === 'browser' || r === 'fallback_browser' || r === 'downloading'){ toast('已跳转浏览器下载，完成后点击安装包安装'); }
      else { toast('更新完成'); }
    }
  }
  window.__onUpdateChecked = onUpdateChecked;
  window.__onAutoUpdate = onAutoUpdate;
  window.__onInstallProgress = onInstallProgress;
  window.__onInstallDone = onInstallDone;

  $('checkUpdateBtn').onclick = function(){
    var b = bridge();
    if(b && b.checkUpdate){ b.checkUpdate(); toast('正在检查…'); }
    else { toast('当前 App 版本不支持'); }
  };
  setVer();

  // 音效初始化
  loadSound();
  function resumeAudioOnce(){ Sound.resume(); }
  document.addEventListener('touchend', resumeAudioOnce, {once:true});
  document.addEventListener('click', resumeAudioOnce, {once:true});
  document.addEventListener('click', function(e){
    var el = e.target;
    var b = (el && el.closest) ? el.closest('button') : (el && el.tagName === 'BUTTON' ? el : null);
    if(!b || b.id === 'sendBtn') return;
    Sound.tap();
  }, true);
  $('soundToggle').onchange = function(){
    var on = this.checked;
    Sound.setEnabled(on);
    try{ localStorage.setItem('rc_sound', on ? '1' : '0'); }catch(e){}
    if(on) Sound.tap();
  };
  // 聊天背景颜色
  function applyChatBg(v){
    document.body.classList.remove('bg-red','bg-blue');
    if(v === 'red') document.body.classList.add('bg-red');
    else if(v === 'blue') document.body.classList.add('bg-blue');
    var opts = document.querySelectorAll('.bgOpt');
    for(var i=0;i<opts.length;i++){
      opts[i].classList.toggle('sel', opts[i].getAttribute('data-bg') === v);
    }
  }
  (function(){
    var saved = 'purple';
    try{ saved = localStorage.getItem('rc_chatbg') || 'purple'; }catch(e){}
    applyChatBg(saved);
    var opts = document.querySelectorAll('.bgOpt');
    for(var i=0;i<opts.length;i++){
      opts[i].onclick = function(){
        var v = this.getAttribute('data-bg');
        applyChatBg(v);
        try{ localStorage.setItem('rc_chatbg', v); }catch(e){}
        toast('聊天背景已切换');
      };
    }
  })();
  $('aumUpdate').onclick = function(){ doInstall(true); };
  $('aumLater').onclick = function(){ $('autoUpdateModal').style.display='none'; };

  loadPrefs();
  showHome();
  setTimeout(function(){ var sp=$('splash'); if(sp){ sp.classList.add('hide'); setTimeout(function(){ sp.style.display='none'; }, 600); } }, 1800);
})();
</script>
</body>
</html>
